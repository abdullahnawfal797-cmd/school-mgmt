<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}منظومة الإدارة المدرسية الحديثة{% endblock %}</title>
    <style>
    :root {
        --primary: #5e35b1;
        --primary-grad: linear-gradient(135deg, #673ab7 0%, #512da8 100%);
        --bg: #f4f6fb;
        --card-border: #e8ecf4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: var(--bg);
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        color: #2e384d;
        padding-bottom: 50px;
        direction: rtl;
    }
    .container { max-width: 1250px; margin: 0 auto; padding: 0 15px; }
    .app-header {
        background: var(--primary-grad);
        color: #fff;
        border-radius: 0 0 20px 20px;
        padding: 18px 25px;
        margin-bottom: 22px;
        box-shadow: 0 4px 15px rgba(94, 53, 177, 0.25);
    }
    .d-flex { display: flex !important; }
    .justify-content-between { justify-content: space-between !important; }
    .align-items-center { align-items: center !important; }
    .flex-wrap { flex-wrap: wrap !important; }
    .gap-2 { gap: 8px !important; }
    .gap-3 { gap: 15px !important; }
    .mb-0 { margin-bottom: 0 !important; }
    .mb-2 { margin-bottom: 8px !important; }
    .mb-3 { margin-bottom: 14px !important; }
    .mb-4 { margin-bottom: 22px !important; }
    .fw-bold { font-weight: 700 !important; }
    .text-muted { color: #6c757d !important; }
    .text-primary { color: #5e35b1 !important; }
    .small { font-size: 0.85rem !important; }
    .opacity-75 { opacity: 0.75 !important; }
    
    .card-custom {
        background: #fff;
        border-radius: 14px;
        border: 1px solid var(--card-border);
        box-shadow: 0 3px 10px rgba(0,0,0,0.03);
        padding: 18px 22px;
    }

    /* شبكة الأزرار والأقسام */
    .portal-section-title {
        font-size: 0.95rem;
        font-weight: bold;
        color: #556987;
        margin: 18px 0 10px 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .portal-section-title::before {
        content: "";
        display: inline-block;
        width: 4px;
        height: 16px;
        background: var(--primary);
        border-radius: 2px;
    }
    .portal-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 15px;
    }
    .portal-btn-card {
        background: #ffffff;
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 16px 12px;
        text-align: center;
        text-decoration: none;
        color: #2d3748;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        transition: all 0.2s ease-in-out;
        cursor: pointer;
    }
    .portal-btn-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(94, 53, 177, 0.12);
        border-color: #5e35b1;
        color: #5e35b1;
        background: #faf9fe;
    }
    .portal-btn-card .card-icon {
        font-size: 24px;
        line-height: 1;
        display: inline-block;
        margin-bottom: 4px;
    }
    .portal-btn-card .card-label {
        font-size: 0.92rem;
        font-weight: 600;
    }

    /* أزرار الإحصائيات السفلية */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }
    .stat-card {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid var(--card-border);
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .stat-card.green { border-top: 4px solid #10b981; }
    .stat-card.yellow { border-top: 4px solid #f59e0b; }
    .stat-card.blue { border-top: 4px solid #3b82f6; }
    .stat-card.purple { border-top: 4px solid #8b5cf6; }
    .stat-number { font-size: 1.6rem; font-weight: bold; color: #1e293b; margin-top: 5px; }

    .btn-header {
        background: #fff;
        color: #5e35b1;
        text-decoration: none;
        padding: 6px 18px;
        border-radius: 50px;
        font-weight: bold;
        font-size: 0.88rem;
    }
    .form-select {
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background-color: #fff;
        font-family: inherit;
    }
</style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <h3 class="mb-0 fw-bold">نظام الإدارة المدرسية الحديث</h3>
                <small class="opacity-75">جمهورية العراق - وزارة التربية</small>
            </div>
            <div>
                <a href="{% url 'portal_settings' %}" class="btn-header">إعدادات النظام</a>
            </div>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
