{% extends 'portal/base_portal.html' %}

{% block title %}التحقق الأمني{% endblock %}


{% block content %}
<div class="row justify-content-center pt-5" dir="rtl">
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 text-center">
            <div class="mb-3">
                <i class="bi bi-shield-lock text-secondary display-5"></i>
            </div>
            <h6 class="fw-bold text-dark mb-1">التحقق الأمني للنظام</h6>
            <p class="small text-muted mb-4" style="font-size: 12px;">يرجى تأكيد الهوية للوصول إلى صلاحيات الصيانة</p>

            <form method="POST" autocomplete="off">
                {% csrf_token %}
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-muted">المعرف:</label>
                    <input type="text" name="username" class="form-control text-center fw-bold dir-ltr" required autocomplete="new-password" autofocus>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold text-muted">رمز المرور:</label>
                    <input type="password" name="password" class="form-control text-center fw-bold dir-ltr" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-dark w-100 rounded-pill fw-bold py-2 shadow-sm">
                    تأكيد الدخول
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
